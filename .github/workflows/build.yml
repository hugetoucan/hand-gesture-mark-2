name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# GITHUB_TOKEN needs write access to create releases with the APK attached
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.2
    
    - name: Create assets directory
      run: mkdir -p app/src/main/assets
    
    - name: Download MediaPipe Hand Landmarker model
      run: |
        curl -L "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task" \
             -o app/src/main/assets/hand_landmarker.task
        ls -lh app/src/main/assets/
    
    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: hand-gesture-mark2-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
    
    - name: Get APK info
      if: success()
      run: |
        ls -lh app/build/outputs/apk/debug/
        echo "APK Size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
    
    - name: Create Release
      if: success() && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2.${{ github.run_number }}
        name: Hand Gesture Mark 2 - v1.2.${{ github.run_number }}
        body: |
          ## 👋 Hand Gesture Control - Mark 2

          **Build #${{ github.run_number }}**

          ### ✨ Features:
          - 👆 Point to tap - Hold finger still for 1 second
          - ↔️ Swipe gestures - Scroll left/right/up/down (palm or pointing finger)
          - 🔒 One-shot gestures - a gesture fires once until the hand is removed
          - ✌️ Two finger activation
          - 📷 Front camera only
          - 🔋 Battery optimized
          - 📱 Works offline - No internet needed

          ### 📥 Installation:
          1. Download `app-debug.apk` below
          2. Enable "Install from Unknown Sources"
          3. Install the APK
          4. Grant Camera, Overlay, and Accessibility permissions
          5. Start using hand gestures!
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
